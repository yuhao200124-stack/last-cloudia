<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="技能分类预览：从游戏数据自动分类的基础属性技能。" />
    <title>技能分类预览</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=20260929-home" />
    <link rel="stylesheet" href="./game-skills.css?v=20260929-build" />
    <link rel="stylesheet" href="./skill-classes-preview.css?v=20260929-preview5" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-mark" aria-hidden="true">LC</div>
      <div class="brand-copy">
        <h1>技能分类预览</h1>
        <p>从游戏数据自动分类 · 还没有替换技能表的分页</p>
      </div>
      <nav class="header-actions" aria-label="页面导航"><a class="header-nav-link" href="./index.html">技能表</a><a class="header-nav-link" href="./characters.html?v=20260926-mayly">角色列表</a></nav>
    </header>
    <main>
      <section class="workspace" aria-label="技能分类预览">
        <div class="toolbar">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="搜索技能名称（繁简均可）" />
            <button id="clearSearch" type="button" aria-label="清空搜索" hidden>清空</button>
          </label>
          <div class="game-toolbar-right">
            <div class="script-toggle" role="group" aria-label="文字">
              <button type="button" data-script="t" aria-pressed="true">游戏原文（繁）</button>
              <button type="button" data-script="s" aria-pressed="false">简体</button>
            </div>
            <div class="result-summary" id="resultSummary" aria-live="polite"></div>
          </div>
        </div>
        <nav class="sheet-tabs" id="catTabs" aria-label="大类"></nav>
        <nav class="sub-tabs" id="subTabs" aria-label="小类"></nav>
        <div class="filter-rows" id="filterRows" hidden></div>
        <p class="preview-hint">每个小类先放<b>没有条件</b>的，再放<b>有条件</b>的，各自按加成从大到小。一个技能属于几个分类，就会出现在几个页签里；效果下面的“也在”列出它的其他分类。条件栏里<span class="chip apply">蓝色</span>是加成适用的属性／攻击，<span class="chip">黄色</span>才是条件。</p>
        <div id="previewArea" class="table-area"></div>
      </section>
    </main>
    <script src="./game-skill-data.js?v=20260929-home"></script>
    <script src="./skill-classes-preview-data.js?v=20260929-preview5"></script>
    <script src="./skill-classes-preview.js?v=20260929-preview5"></script>
  </body>
</html>
