<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="按完整效果词条逐类贴标签，核对已有分类与未完成条件。" />
    <title>技能列表打标签用的｜最后的克劳迪娅</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=20260926-common-skills" />
    <link rel="stylesheet" href="./skill-labeling.css?v=20260925-supplements" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-mark" aria-hidden="true">LC</div>
      <div class="brand-copy"><h1>技能列表打标签用的</h1><p>最后的克劳迪娅</p></div>
      <nav class="header-actions" aria-label="页面导航">
        <a class="header-nav-link" href="./index.html?v=20260926-mayly">技能表</a>
        <a class="header-nav-link" href="./characters.html?v=20260926-mayly">角色列表</a>
        <a class="header-nav-link" href="./damage-calculator.html?v=20260926-mayly">伤害计算器</a>
      </nav>
    </header>
    <main>
      <section class="workspace labeling-workspace" aria-label="技能标签核对列表">
        <nav class="sheet-tabs label-tabs" id="labelTabs" role="tablist" aria-label="技能标签分类" aria-orientation="horizontal"></nav>
        <div id="labelPanel" role="tabpanel" aria-labelledby="label-subtab-single-weapon">
        <div class="sheet-heading"><div><span class="sheet-kicker">技能标签核对</span><h2 id="activeTagTitle">单手</h2></div></div>
        <nav id="labelSubTabs" class="sheet-tabs label-tabs label-subtabs" role="tablist" aria-label="单手子分类" aria-orientation="horizontal" hidden></nav>
        <div class="labeling-overview">
          <p id="labelCoverage">正在读取全库核对结果…</p>
          <p id="judgmentSummary" aria-live="polite"></p>
          <p id="cumulativeCoverage"></p>
          <p>按效果与影响归属的条件分类。保留武器、攻击类型、属性、对象及触发限定；具体概率、Buff时长、数值曲线、回复公式等机制细节不单独拆分，也不影响分类完成。</p>
          <p id="conditionScope">单手按武器总数恰好1把判断。“两手剑／枪”等技能也属于这一类。按武器类型、伤害种类及附加条件分组；明确包含空武器的分支另写0或1把，绝不把0把当成1把。效果与影响归属的条件完成分类即可；同一技能跨组去重。</p>
        </div>
        <div class="toolbar">
          <label class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="labelSearch" type="search" autocomplete="off" placeholder="搜索技能名称、效果或待判断内容" aria-label="搜索单手相关技能" /><button id="clearLabelSearch" type="button" hidden>清空</button></label>
          <div id="labelResultCount" class="result-summary" aria-live="polite"></div>
        </div>
        <div id="labelTable" class="table-area"></div>
        <p id="labelEmpty" class="label-empty" hidden>没有符合当前搜索条件的技能。</p>
        <noscript><p class="label-empty">请启用JavaScript以查看技能列表。</p></noscript>
        </div>
      </section>
    </main>
    <script src="./data.js?v=20260924-table-review"></script>
    <script type="module" src="./skill-labeling.mjs?v=20260926-classification-scope"></script>
  </body>
</html>
