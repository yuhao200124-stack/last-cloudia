<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="按技能的具体效果逐类贴标签，本轮核对物理伤害增加相关技能。" />
    <title>技能列表打标签用的｜最后的克劳迪娅</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=20260924-physical-labels" />
    <link rel="stylesheet" href="./skill-labeling.css?v=20260924-physical-labels" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-mark" aria-hidden="true">LC</div>
      <div class="brand-copy"><h1>技能列表打标签用的</h1><p>最后的克劳迪娅</p></div>
      <nav class="header-actions" aria-label="页面导航">
        <a class="header-nav-link" href="./index.html">技能表</a>
        <a class="header-nav-link" href="./characters.html">角色列表</a>
        <a class="header-nav-link" href="./damage-calculator.html">伤害计算器</a>
      </nav>
    </header>
    <main>
      <section class="workspace labeling-workspace" aria-label="技能标签核对列表">
        <nav class="sheet-tabs label-tabs" id="labelTabs" role="tablist" aria-label="技能标签分类" aria-orientation="horizontal"></nav>
        <div id="labelPanel" role="tabpanel" aria-labelledby="label-tab-physical">
        <div class="sheet-heading"><div><span class="sheet-kicker">本轮：物理伤害增加</span><h2 id="activeTagTitle">物理伤害增加</h2></div></div>
        <div class="labeling-overview">
          <p id="labelCoverage">正在读取全库核对结果…</p>
          <p id="judgmentSummary" aria-live="polite"></p>
          <p id="cumulativeCoverage"></p>
          <p>本轮处理明确的物理增伤；通用伤害、属性通用伤害，以及仅限普攻、特技、必杀或反击的增伤，留待对应标签。敌方物理易伤会单独注明作用对象。</p>
          <p>所有效果和条件都贴完标签，才算已完整判断。已处理攻击力、防御力、生命力（HP上限属性）、魔力（INT）、MP上限属性、物理伤害增加；其余效果和条件继续留待判断。按已完整判断、判断部分、没办法判断排序。</p>
        </div>
        <div class="toolbar">
          <label class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="labelSearch" type="search" autocomplete="off" placeholder="搜索技能名称、效果或待判断内容" aria-label="搜索物理伤害增加相关技能" /><button id="clearLabelSearch" type="button" hidden>清空</button></label>
          <div id="labelResultCount" class="result-summary" aria-live="polite"></div>
        </div>
        <div id="labelTable" class="table-area"></div>
        <p id="labelEmpty" class="label-empty" hidden>没有符合当前搜索条件的技能。</p>
        <noscript><p class="label-empty">请启用JavaScript以查看技能列表。</p></noscript>
        </div>
      </section>
    </main>
    <script src="./data.js?v=20260924-table-review"></script>
    <script type="module" src="./skill-labeling.mjs?v=20260924-physical-labels"></script>
  </body>
</html>
